<rect width="1200" height="740" fill="#ffffff"/>
<text x="36" y="42" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#16202c">04 - Data flow: raw bytes to verdict</text>
<text x="36" y="67" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b7d">Every published number is traceable back to a raw line, a cgroup sample or a verified timing.</text>
