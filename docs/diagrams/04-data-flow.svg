<text x="74" y="611" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#12336b" text-anchor="start">Traceability rule</text>
<text x="74" y="628" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="start">A number is never invented: HTTP metrics come from one raw.jsonl line per request;</text>
