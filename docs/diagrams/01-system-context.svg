<text x="684" y="493" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#7c4a05" text-anchor="start">What this means</text>
<text x="684" y="510" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="start">Every run is client-only: latency, throughput, errors and</text>
<text x="684" y="527" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="start">availability are real observations over the wire. Server CPU,</text>
<text x="684" y="544" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="start">RAM and OOM state are not visible and are never estimated -</text>
<text x="684" y="561" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="start">those SLOs grade N/A - insufficient evidence.</text>
