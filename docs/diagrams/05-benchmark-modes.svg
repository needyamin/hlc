<text x="72" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0f8a7a" text-anchor="start">-</text>
<text x="86" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">cgroup v2 anon / peak / cpu.stat / io.stat</text>
<text x="72" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0f8a7a" text-anchor="start">-</text>
<text x="86" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">per-process RSS, threads, OOM kills, restarts</text>
<text x="72" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0f8a7a" text-anchor="start">-</text>
<text x="86" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">optional runtime internals + browser CDP</text>
<text x="72" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0f8a7a" text-anchor="start">-</text>
<text x="86" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">pinned --cpus / --memory / --cpuset-cpus</text>
