<text x="442" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#7c4a05" text-anchor="start">visibility: server_via_adapter</text>
<rect x="430" y="256" width="340" height="168" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="442" y="276" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c07a12" text-anchor="start">-</text>
<text x="456" y="276" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">HTTP client metrics (as above)</text>
<text x="442" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c07a12" text-anchor="start">-</text>
<text x="456" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Prometheus / cAdvisor / APM metrics</text>
<text x="442" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c07a12" text-anchor="start">-</text>
<text x="456" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">collected via a future Collector adapter</text>
<text x="442" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c07a12" text-anchor="start">-</text>
<text x="456" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">no cgroup files without a container</text>
<text x="442" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c07a12" text-anchor="start">-</text>
<text x="456" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">NOT BUILT IN THIS ROUND</text>
<rect x="430" y="436" width="340" height="32" rx="16.0" fill="#fff2dc" stroke="#c07a12" stroke-width="1.2"/>
<text x="600.0" y="455.74" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#7c4a05" text-anchor="middle">FUTURE ADAPTER</text>
<polyline points="600.0,160.0 600.0,180.0" fill="none" stroke="#7a8899" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<rect x="800" y="180" width="364" height="46" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="982.0" y="207.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#822018" text-anchor="middle">live_blackbox</text>
<text x="812" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#822018" text-anchor="start">visibility: client_only</text>
