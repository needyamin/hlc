<rect width="1200" height="760" fill="#ffffff"/>
<text x="36" y="42" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#16202c">05 - Benchmark modes and the comparability gate</text>
<text x="36" y="67" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b7d">Which mode you get depends on what you control - and only one mode may be ranked against another run.</text>
