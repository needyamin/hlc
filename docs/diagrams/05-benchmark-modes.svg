<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="ttl dsc">
<title id="ttl">05 - Benchmark modes and the comparability gate</title>
<desc id="dsc">Which mode you get depends on what you control - and only one mode may be ranked against another run.</desc>
