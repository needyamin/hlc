<text x="812" y="276" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">-</text>
<text x="826" y="276" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">HTTP latency, status, errors, RPS, bytes</text>
<text x="812" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">-</text>
<text x="826" y="306" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">optional browser FCP / LCP / JS heap</text>
<text x="812" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">-</text>
<text x="826" y="336" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">resources.* -&gt; unavailable</text>
<text x="812" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">-</text>
<text x="826" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">series.cgroup_series -&gt; unavailable</text>
<text x="812" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">-</text>
<text x="826" y="396" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">never infer server CPU / RAM from latency</text>
<rect x="800" y="436" width="364" height="32" rx="16.0" fill="#fdeaea" stroke="#c0392b" stroke-width="1.2"/>
<text x="982.0" y="455.74" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#822018" text-anchor="middle">NOT COMPARABLE</text>
<polyline points="982.0,160.0 982.0,180.0" fill="none" stroke="#7a8899" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<text x="60" y="506" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#16202c" text-anchor="start">schema.can_compare(a, b)  -  HARD RULE, ENFORCED BEFORE ANY LEADERBOARD</text>
<rect x="60" y="522" width="540" height="116" rx="10" fill="#f0ebff" stroke="#6d4bd8" stroke-width="1.6"/>
<text x="330.0" y="568.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#432a91" text-anchor="middle">ALL of these must hold</text>
<text x="330.0" y="584.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="middle">same benchmark_mode  +  same visibility  +  same schema_version</text>
<text x="330.0" y="600.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5b6b7d" text-anchor="middle">same workload_class  +  visibility != client_only</text>
<polyline points="600.0,580.0 650.0,580.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<rect x="650" y="522" width="250" height="52" rx="10" fill="#e6f6ea" stroke="#18803d" stroke-width="1.6"/>
<text x="775.0" y="552.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0d5427" text-anchor="middle">FAIR COMPARISON</text>
<rect x="920" y="522" width="244" height="52" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="1042.0" y="552.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#822018" text-anchor="middle">NOT COMPARABLE</text>
<rect x="980" y="484" width="164" height="24" rx="12.0" fill="#fdeaea" stroke="#c0392b" stroke-width="1.2"/>
<text x="1062.0" y="499.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#822018" text-anchor="middle">any rule fails</text>
<polyline points="1062.0,508.0 1062.0,522.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_red)" stroke-dasharray="7 5"/>
<rect x="650" y="590" width="514" height="48" rx="8" fill="#fff2dc" stroke="#c07a12" stroke-width="1.1"/>
<rect x="650" y="590" width="4" height="48" rx="2" fill="#c07a12" stroke="#c07a12" stroke-width="0"/>
<text x="664" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Otherwise: comparable=False + a reason; no ranking, no winner, no misleading chart.</text>
<rect x="60" y="644" width="1104" height="60" rx="8" fill="#eff3f8" stroke="#7a8899" stroke-width="1.1"/>
<rect x="60" y="644" width="4" height="60" rx="2" fill="#7a8899" stroke="#7a8899" stroke-width="0"/>
<text x="74" y="667" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#3f4c5c" text-anchor="start">Do not quote raw lab CPU% as absolute capacity</text>
<text x="74" y="683.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">cgroup files live in the WSL2 Linux VM and are reached by docker exec; target, VM and generator share physical cores.</text>
<text x="74" y="700.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Pin cores, subtract the idle baseline, and always keep environment.fingerprint.host_shared_cpu=true.</text>
<line x1="36" y1="716" x2="1164" y2="716" stroke="#d8e1ec" stroke-width="1"/>
<text x="36" y="736" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Sources: heavyload/schema/metrics.py (can_compare, VISIBILITY_LEVELS), compare.py, report_compare.py, config.py, docs/benchmark-modes.md</text>
</svg>
