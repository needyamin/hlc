<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="ttl dsc">
<title id="ttl">06 - Language runtime comparison pipeline</title>
<desc id="dsc">Three pinned workloads, identical algorithms in five languages, one checksum gate, zero simulated numbers.</desc>
<defs>
<marker id="ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a7a"/></marker>
<marker id="ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4bd8"/></marker>
<marker id="ar_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c07a12"/></marker>
<marker id="ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18803d"/></marker>
<marker id="ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8899"/></marker>
<marker id="ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d"/></marker>
</defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="36" y="42" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#16202c">06 - Language runtime comparison pipeline</text>
<text x="36" y="67" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b7d">Three pinned workloads, identical algorithms in five languages, one checksum gate, zero simulated numbers.</text>
<line x1="36" y1="84" x2="1164" y2="84" stroke="#d8e1ec" stroke-width="1.5"/>
<rect x="60" y="130" width="340" height="36" rx="10" fill="#f0ebff" stroke="#6d4bd8" stroke-width="1.6"/>
<text x="230.0" y="152.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#432a91" text-anchor="middle">1  PIN THE WORKLOAD</text>
<rect x="60" y="172" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="72" y="194" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">A  prime count, N=50,000</text>
<text x="72" y="216" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">     RESULT 5133 121013308</text>
<text x="72" y="238" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">B  JSON round-trip, 200 x 600</text>
<text x="72" y="260" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">     RESULT 249868800 9163</text>
<text x="72" y="282" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">C  map lookups, 64 x 100,000</text>
<text x="72" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">     RESULT 44432313 100000</text>
<rect x="60" y="330" width="340" height="40" rx="8" fill="#f0ebff" stroke="#6d4bd8" stroke-width="1.1"/>
<rect x="60" y="330" width="4" height="40" rx="2" fill="#6d4bd8" stroke="#6d4bd8" stroke-width="0"/>
<text x="74" y="352" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Change a constant -&gt; checksum changes -&gt; run is rejected.</text>
<rect x="430" y="130" width="340" height="36" rx="10" fill="#e8f0ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="600.0" y="152.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12336b" text-anchor="middle">2  GENERATE + BUILD</text>
<rect x="430" y="172" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="442" y="194" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Sources: Spid3r, PHP, Python, Node, Rust</text>
<text x="442" y="216" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start"></text>
<text x="442" y="238" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Variants: tree-walk, VM, VM --no-opt,</text>
<text x="442" y="260" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">.matrixc exec, build --release,</text>
<text x="442" y="282" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">rustc -O, and the real binary copied into</text>
<text x="442" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">the running Docker container.</text>
<rect x="430" y="330" width="340" height="40" rx="8" fill="#e8f0ff" stroke="#2563eb" stroke-width="1.1"/>
<rect x="430" y="330" width="4" height="40" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="444" y="352" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Missing toolchain -&gt; skipped with a warning, never faked.</text>
<rect x="800" y="130" width="340" height="36" rx="10" fill="#e3f6f2" stroke="#0f8a7a" stroke-width="1.6"/>
<text x="970.0" y="152.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0b5c53" text-anchor="middle">3  MEASURE</text>
<rect x="800" y="172" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="812" y="194" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Run every variant N times (default 5).</text>
<text x="812" y="216" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Each program prints RESULT and TIME_US.</text>
<text x="812" y="238" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start"></text>
<text x="812" y="260" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Timing is IN-PROCESS: process startup,</text>
<text x="812" y="282" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">compilation and docker exec overhead are</text>
<text x="812" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">excluded. Report the median compute time.</text>
<rect x="800" y="330" width="340" height="40" rx="8" fill="#e3f6f2" stroke="#0f8a7a" stroke-width="1.1"/>
<rect x="800" y="330" width="4" height="40" rx="2" fill="#0f8a7a" stroke="#0f8a7a" stroke-width="0"/>
<text x="814" y="352" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Spid3r has only now_ms(), so workloads are sized &gt;= 28 ms.</text>
<rect x="800" y="400" width="340" height="36" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="970.0" y="422.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#822018" text-anchor="middle">4  CHECKSUM GATE</text>
<rect x="800" y="442" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="812" y="464" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Observed RESULT must be identical across</text>
<text x="812" y="486" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">every repeat AND exactly match EXPECTED.</text>
<text x="812" y="508" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start"></text>
<text x="812" y="530" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Mismatch -&gt; variant REJECTED and never</text>
<text x="812" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">published. Verified rows -&gt; slowdown ratios</text>
<text x="812" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">vs PHP and Python + geometric mean.</text>
<rect x="800" y="600" width="340" height="40" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="1.1"/>
<rect x="800" y="600" width="4" height="40" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="0"/>
<text x="814" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">This is the anti-fake invariant.</text>
<rect x="430" y="400" width="340" height="36" rx="10" fill="#fff2dc" stroke="#c07a12" stroke-width="1.6"/>
<text x="600.0" y="422.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7c4a05" text-anchor="middle">5  SUMMARISE</text>
<rect x="430" y="442" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="442" y="464" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">runtime_comparison.json  (all repeats,</text>
<text x="442" y="486" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">  min/max, versions, ratios)</text>
<text x="442" y="508" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">runtime_comparison.html (self-contained)</text>
<text x="442" y="530" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">sources/ (exact programs per language)</text>
<text x="442" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">results.json &lt;- compact summary</text>
<text x="442" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">report.html &lt;- section 11</text>
<rect x="430" y="600" width="340" height="40" rx="8" fill="#fff2dc" stroke="#c07a12" stroke-width="1.1"/>
<rect x="430" y="600" width="4" height="40" rx="2" fill="#c07a12" stroke="#c07a12" stroke-width="0"/>
<text x="444" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Every normal run and the standalone --runtime-comparison mode.</text>
<rect x="60" y="400" width="340" height="36" rx="10" fill="#e6f6ea" stroke="#18803d" stroke-width="1.6"/>
<text x="230.0" y="422.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0d5427" text-anchor="middle">6  READ IT HONESTLY</text>
<rect x="60" y="442" width="340" height="150" rx="8" fill="#f8fafc" stroke="#d8e1ec" stroke-width="1.2"/>
<text x="72" y="464" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">This measures language-runtime COMPUTE,</text>
<text x="72" y="486" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">not end-to-end web-framework throughput.</text>
<text x="72" y="508" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start"></text>
<text x="72" y="530" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Do NOT compare these milliseconds with</text>
<text x="72" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">RPS / p99 from the HTTP load test.</text>
<text x="72" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#16202c" text-anchor="start">Both answer different questions.</text>
<rect x="60" y="600" width="340" height="40" rx="8" fill="#e6f6ea" stroke="#18803d" stroke-width="1.1"/>
<rect x="60" y="600" width="4" height="40" rx="2" fill="#18803d" stroke="#18803d" stroke-width="0"/>
<text x="74" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Production still runs tree-walk - the slowest Spid3r engine.</text>
<polyline points="400.0,235.0 430.0,235.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<polyline points="770.0,235.0 800.0,235.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<polyline points="970.0,368.0 970.0,400.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<polyline points="800.0,475.0 770.0,475.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<polyline points="430.0,475.0 400.0,475.0" fill="none" stroke="#7a8899" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar_gray)"/>
<rect x="36" y="652" width="15" height="11" rx="3" fill="#e3f6f2" stroke="#0f8a7a" stroke-width="1"/>
<text x="57" y="661.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">always on</text>
<rect x="151.6" y="652" width="15" height="11" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1"/>
<text x="172.6" y="661.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">integrity gate</text>
<rect x="299.20000000000005" y="652" width="15" height="11" rx="3" fill="#e6f6ea" stroke="#18803d" stroke-width="1"/>
<text x="320.20000000000005" y="661.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">output</text>
<rect x="395.6" y="652" width="15" height="11" rx="3" fill="#eff3f8" stroke="#7a8899" stroke-width="1"/>
<text x="416.6" y="661.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">optional / best effort</text>
<line x1="36" y1="676" x2="1164" y2="676" stroke="#d8e1ec" stroke-width="1"/>
<text x="36" y="696" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7d" text-anchor="start">Sources: heavyload/runtime_comparison.py, runner.py, report.py (_runtime_section), cli.py, config.json</text>
</svg>
